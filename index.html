<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c81">
<meta name="application-name" content="민방위 급수시설 점검">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="급수시설 점검">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>민방위 급수시설 점검</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>민방위 급수시설 점검</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
/* Layout concept: a field clipboard — one column, large touch targets, state shown as colored chips with text.
   The report view is a separate A4 paper surface that mirrors the HWP form. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f6f8fb; --fg:#162230; --muted:#5d6c7b; --line:#d3dce6; --line-strong:#aab8c6;
  --primary:#0f4c81; --primary-fg:#ffffff; --primary-soft:#e3eef8;
  --good:#1a7f3c; --good-soft:#e2f3e7; --poor:#c9420a; --poor-soft:#fde9df; --na:#5b6f85; --na-soft:#e7edf3; --none:#8a97a5; --none-soft:#eef1f4;
  --warn:#9a6700; --warn-soft:#fff4d6; --danger:#b42318; --danger-soft:#fde8e6;
  --shadow:0 1px 2px rgba(22,34,48,.06),0 4px 14px rgba(22,34,48,.06);
  --radius:12px; --radius-sm:8px;
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-report:"Noto Serif KR","Apple Myungjo","Batang","HCR Batang",serif;
  --paper:#ffffff; --paper-fg:#000000;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#171f29; --surface-2:#1e2834; --fg:#e7ecf1; --muted:#9fadbb; --line:#2b3745; --line-strong:#3f4d5d;
  --primary:#6aaee6; --primary-fg:#0b1a28; --primary-soft:#17304a;
  --good:#5fcf80; --good-soft:#143322; --poor:#ff9263; --poor-soft:#3d1d0f; --na:#9fb3c8; --na-soft:#1f2b38; --none:#7f8d9b; --none-soft:#1c2531;
  --warn:#f2c14e; --warn-soft:#3a2d08; --danger:#ff8a80; --danger-soft:#3c1512;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#171f29; --surface-2:#1e2834; --fg:#e7ecf1; --muted:#9fadbb; --line:#2b3745; --line-strong:#3f4d5d;
  --primary:#6aaee6; --primary-fg:#0b1a28; --primary-soft:#17304a;
  --good:#5fcf80; --good-soft:#143322; --poor:#ff9263; --poor-soft:#3d1d0f; --na:#9fb3c8; --na-soft:#1f2b38; --none:#7f8d9b; --none-soft:#1c2531;
  --warn:#f2c14e; --warn-soft:#3a2d08; --danger:#ff8a80; --danger-soft:#3c1512;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
a{color:var(--primary)}
.sr{position:absolute;left:-9999px}

/* App bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--primary);color:var(--primary-fg);box-shadow:var(--shadow)}
.appbar-in{display:flex;align-items:center;gap:10px;min-height:56px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1080px;margin:0 auto}
.appbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;background:none;border:0;padding:6px 4px;cursor:pointer;color:inherit;min-width:0}
.appbar .brand small{display:block;font-weight:500;font-size:12px;opacity:.85;letter-spacing:.02em}
.appbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap;border:1px solid transparent}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.appbar .chip{background:rgba(255,255,255,.14);color:var(--primary-fg);border-color:rgba(255,255,255,.25)}
.appbar .chip.sync-ok .dot{background:#7ee2a0}
.appbar .chip.sync-busy .dot{background:#ffd666;animation:pulse 1s infinite}
.appbar .chip.sync-bad .dot{background:#ff8a80}
.appbar .chip.sync-off .dot{background:#c7d2dc}
.appbar .chip.sync-local .dot{background:#9ec5ff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
.iconbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:10px;min-width:44px;min-height:44px;padding:6px 10px;cursor:pointer;font-weight:600;font-size:14px}
.iconbtn:hover{background:rgba(255,255,255,.22)}

/* Page container */
.page{max-width:1080px;margin:0 auto;padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page.narrow{max-width:820px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:14px;margin-bottom:10px}
.crumbs button{background:none;border:0;padding:4px 2px;color:var(--primary);cursor:pointer;font-weight:600;min-height:32px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.pagehead h1{font-size:24px;font-weight:700}
.pagehead .sub{color:var(--muted);font-size:14px;margin-top:4px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card+.card{margin-top:14px}
.card h2{font-size:17px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .count{font-size:13px;color:var(--muted);font-weight:600}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-variant-numeric:tabular-nums}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* Stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:4px;cursor:pointer;text-align:left}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:600}
.stat .val{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .val small{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
.stat.poor .val{color:var(--poor)} .stat.warn .val{color:var(--warn)} .stat.good .val{color:var(--good)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.iconbtn:focus-visible,.stat:focus-visible,.listitem:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn.lg{min-height:56px;font-size:18px;padding:12px 22px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .ico{font-size:18px;line-height:1}

/* Forms */
.field{display:grid;gap:6px}
.field>label{font-size:14px;font-weight:600;color:var(--muted)}
.field .req{color:var(--poor)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);font-size:16px}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input.invalid,textarea.invalid{border-color:var(--poor);box-shadow:0 0 0 2px var(--poor-soft)}
.help{font-size:13px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;min-height:48px;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px;cursor:pointer}
.check input{width:22px;height:22px;margin:0}

/* Lists */
.list{display:grid;gap:8px}
.listitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;color:inherit}
.listitem:hover{border-color:var(--line-strong)}
.listitem .main{flex:1;min-width:0}
.listitem .title{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listitem .meta{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listitem .right{display:grid;gap:4px;justify-items:end;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.poor{background:var(--poor-soft);color:var(--poor)} .tag.na{background:var(--na-soft);color:var(--na)} .tag.none{background:var(--none-soft);color:var(--none)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.info{background:var(--primary-soft);color:var(--primary)} .tag.test{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface)}
.empty b{display:block;color:var(--fg);margin-bottom:6px;font-size:16px}

/* Filters */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.searchbar{display:flex;gap:8px}
.searchbar input{flex:1;min-width:0}

/* Step bar */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:14px}
.steps button{display:grid;gap:4px;justify-items:center;padding:8px 4px;border:0;background:var(--surface);border-bottom:3px solid var(--line);cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-radius:8px 8px 0 0;min-height:56px}
.steps button .n{width:24px;height:24px;border-radius:50%;background:var(--none-soft);color:var(--none);display:grid;place-items:center;font-size:12px;font-weight:700}
.steps button[aria-current="step"]{color:var(--primary);border-bottom-color:var(--primary)}
.steps button[aria-current="step"] .n{background:var(--primary);color:var(--primary-fg)}
.steps button.done .n{background:var(--good);color:#fff}
.steps button.partial .n{background:var(--warn);color:#fff}
@media (max-width:480px){ .steps button{font-size:11px;padding:6px 2px} }
@media (max-width:560px){ .appbar .brand{font-size:15px} .appbar .brand small{display:none} .appbar .chip{font-size:12px;padding:3px 8px;max-width:150px} .appbar .chip span:last-child{overflow:hidden;text-overflow:ellipsis} .iconbtn{min-width:40px;padding:6px 8px;font-size:13px} }

/* Progress */
.progress{height:10px;background:var(--none-soft);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .3s}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.counts .tag{font-size:13px;padding:4px 10px}

/* Checklist item */
.item{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--none);border-radius:var(--radius);padding:14px 16px;display:grid;gap:10px}
.item.good{border-left-color:var(--good)} .item.poor{border-left-color:var(--poor)} .item.na{border-left-color:var(--na)}
.item .ihead{display:flex;gap:10px;align-items:flex-start}
.item .ihead .num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:15px}
.item .ihead .t{flex:1;min-width:0}
.item .ihead .t h3{font-size:17px;font-weight:700}
.item .ihead .t .note{font-size:14px;color:var(--muted);margin-top:3px}
.item .state{flex:none}
.item .seg button{min-height:52px;font-size:17px}
.item .seg button.good[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.item .seg button.poor[aria-pressed="true"]{background:var(--poor);border-color:var(--poor);color:#fff}
.item .seg button.na[aria-pressed="true"]{background:var(--na);border-color:var(--na);color:#fff}
.item .auto{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--na-soft);color:var(--na);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
.item .photorow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.item .photorow .thumbs{display:flex;gap:6px;flex-wrap:wrap}
.timer{display:grid;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px}
.timer .clock{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:center}
.timer .clock.done{color:var(--good)}
.timer .clock.running{color:var(--primary)}
.timer .tbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.timer .tbtns .btn{flex:1 1 90px}
.timer .log{font-size:13px;color:var(--muted);text-align:center}

/* Photos */
.pcat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:10px}
.pcat .phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pcat .phead h3{font-size:17px;font-weight:700;flex:1}
.pcat .phead .n{font-size:13px;color:var(--muted);font-weight:600}
.pbtns{display:flex;gap:8px;flex-wrap:wrap}
.pbtns .btn{flex:1 1 140px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);padding:0;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.r90 img{transform:rotate(90deg)} .thumb.r180 img{transform:rotate(180deg)} .thumb.r270 img{transform:rotate(270deg)}
.thumb .badge{position:absolute;left:4px;top:4px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.6);color:#fff}
.thumb .badge.cover{background:var(--primary);color:var(--primary-fg)}
.thumb .badge.pend{background:var(--warn);color:#fff;left:auto;right:4px}
.thumb .badge.fail{background:var(--danger);color:#fff;left:auto;right:4px}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:3px 6px;background:rgba(0,0,0,.55);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.thumb.sm{width:56px;height:56px;aspect-ratio:auto;border-radius:8px}
.noimg{display:grid;place-items:center;height:100%;color:var(--muted);font-size:12px;padding:6px;text-align:center}

/* Lightbox */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,24,.72);display:flex;align-items:center;justify-content:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.modal .box{background:var(--surface);color:var(--fg);border-radius:14px;max-width:720px;width:100%;max-height:100%;overflow:auto;padding:16px;display:grid;gap:12px}
.modal .box.wide{max-width:980px}
.modal .viewer{background:#0b1016;border-radius:10px;display:grid;place-items:center;min-height:240px;max-height:60vh;overflow:hidden}
.modal .viewer img{max-width:100%;max-height:60vh;object-fit:contain;display:block}
.modal .viewer.r90 img,.modal .viewer.r270 img{max-width:60vh;max-height:100%}
.modal .viewer.r90 img{transform:rotate(90deg)} .modal .viewer.r180 img{transform:rotate(180deg)} .modal .viewer.r270 img{transform:rotate(270deg)}
.modal h2{font-size:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.toolbar .btn{flex:1 1 110px}

/* Review */
.review-list{display:grid;gap:8px}
.review-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2)}
.review-row .t{flex:1;min-width:0}
.review-row .t b{display:block;font-size:15px}
.review-row .t span{display:block;font-size:14px;color:var(--muted);white-space:pre-wrap}
.alert{padding:12px 14px;border-radius:var(--radius-sm);font-size:15px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.poor{background:var(--poor-soft);color:var(--poor)} .alert.good{background:var(--good-soft);color:var(--good)} .alert.info{background:var(--primary-soft);color:var(--primary)} .alert.na{background:var(--na-soft);color:var(--na)}
.alert.warn b,.alert.poor b,.alert.good b,.alert.info b{color:inherit}

/* Bottom nav */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.bottombar-in{display:flex;gap:10px;max-width:820px;margin:0 auto;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bottombar .btn{flex:1}
.bottombar .savestate{flex:0 0 auto;display:grid;align-content:center;justify-items:center;font-size:12px;color:var(--muted);min-width:70px;font-weight:600}
.savestate.saving{color:var(--warn)} .savestate.saved{color:var(--good)} .savestate.failed{color:var(--danger)} .savestate.queued{color:var(--na)}

/* Toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;width:min(92vw,480px)}
.toast{background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:10px;font-size:15px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.toast.err{background:var(--danger);color:#fff}
.toast .btn{min-height:36px;padding:4px 10px;font-size:14px;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);color:inherit}

/* Tables (settings/user) */
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.scrollx{overflow-x:auto}

/* ===== REPORT (A4) ===== */
.report-wrap{display:grid;gap:18px;justify-items:center;background:var(--none-soft);padding:16px 0;border-radius:var(--radius);overflow-x:auto}

/* ---- EXIF DateTimeOriginal ---- */
async function readExifDate(file){
  try{
    const buf = await file.slice(0, 256*1024).arrayBuffer();
    const v = new DataView(buf);
    if (v.getUint16(0)!==0xFFD8) return null;
    let off=2;
    while (off+4 < v.byteLength){
      const marker=v.getUint16(off); const len=v.getUint16(off+2);
      if (marker===0xFFE1){
        const start=off+4;
        if (v.getUint32(start)!==0x45786966) return null; // "Exif"
        const tiff=start+6; const little = v.getUint16(tiff)===0x4949;
        const g16=(p)=>v.getUint16(p,little), g32=(p)=>v.getUint32(p,little);
        const ifd0=tiff+g32(tiff+4);
        const readIFD=(p, want)=>{ const n=g16(p); for(let i=0;i<n;i++){ const e=p+2+i*12; const tag=g16(e); if(tag===want) return e; } return null; };
        const exifPtrE = readIFD(ifd0, 0x8769);
        let dateE=null;
        if (exifPtrE){ const exifIfd=tiff+g32(exifPtrE+8); dateE=readIFD(exifIfd,0x9003); }
        if (!dateE) dateE=readIFD(ifd0,0x0132);
        if (!dateE) return null;
        const cnt=g32(dateE+4); const valOff=tiff+g32(dateE+8);
        if (valOff+cnt>v.byteLength) return null;
        let s=''; for(let i=0;i<cnt-1;i++) s+=String.fromCharCode(v.getUint8(valOff+i));
        const m=s.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
        if(!m) return null;
        const d=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]);
        return isNaN(d)?null:d.toISOString();
      }
      if ((marker & 0xFF00)!==0xFF00) break;
      off += 2+len;
    }
  }catch(e){}
  return null;
}
/* ---- 이미지 축소(EXIF 방향 반영, JPEG 재인코딩) ---- */
async function processImage(file, maxSide=1600){
  let bmp=null;
  try{ bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }catch(e){}
  if(!bmp){
    bmp = await new Promise((res,rej)=>{ const url=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{URL.revokeObjectURL(url);res(im)}; im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('이미지를 열 수 없습니다'))}; im.src=url; });
  }
  const w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight;
  const scale=Math.min(1, maxSide/Math.max(w,h));
  const cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  c.getContext('2d').drawImage(bmp,0,0,cw,ch);
  if (bmp.close) bmp.close();
  const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));
  if(!blob) throw new Error('이미지 변환 실패');
  return {blob, w:cw, h:ch};
}
/* 회전을 반영해 캔버스에 contain 방식으로 그리기 (보고서용) */
function drawContain(canvas, img, rotation, boxW, boxH, dpr=2){
  canvas.width=Math.round(boxW*dpr); canvas.height=Math.round(boxH*dpr);
  canvas.style.width=boxW+'px'; canvas.style.height=boxH+'px';
  const ctx=canvas.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  const rot=((rotation||0)%360+360)%360;
  const rw = (rot===90||rot===270)? ih: iw, rh=(rot===90||rot===270)? iw: ih;
  const s=Math.min(canvas.width/rw, canvas.height/rh);
  ctx.save(); ctx.translate(canvas.width/2, canvas.height/2); ctx.rotate(rot*Math.PI/180);
  ctx.drawImage(img, -iw*s/2, -ih*s/2, iw*s, ih*s); ctx.restore();
}

/* ===================== IndexedDB (임시 보관) ===================== */
const IDB = {
  db:null, mem:{docs:new Map(), blobs:new Map(), meta:new Map()}, ok:false,
  async open(){
    try{
      this.db = await new Promise((res,rej)=>{ const r=indexedDB.open('mbw-inspect-v1',1);
        r.onupgradeneeded=e=>{ const d=e.target.result; if(!d.objectStoreNames.contains('docs')) d.createObjectStore('docs',{keyPath:'path'}); if(!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs'); if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta'); };
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked')); });
      this.ok=true;
    }catch(e){ this.ok=false; }
  },
  _req(store, mode, fn){ return new Promise((res,rej)=>{ try{ const tx=this.db.transaction(store,mode); const st=tx.objectStore(store); const r=fn(st); tx.oncomplete=()=>res(r&&r.result!==undefined?r.result:undefined); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }catch(e){ rej(e); } }); },
  async get(store,key){ if(!this.ok) return this.mem[store].get(key); try{ return await this._req(store,'readonly',st=>st.get(key)); }catch(e){ return this.mem[store].get(key); } },
  async put(store,val,key){ if(!this.ok){ this.mem[store].set(key!==undefined?key:val.path,val); return; } try{ await this._req(store,'readwrite',st=> key!==undefined? st.put(val,key): st.put(val)); }catch(e){ this.mem[store].set(key!==undefined?key:val.path,val); } },
  async del(store,key){ if(!this.ok){ this.mem[store].delete(key); return; } try{ await this._req(store,'readwrite',st=>st.delete(key)); }catch(e){} },
  async all(store){ if(!this.ok) return Array.from(this.mem[store].values()); try{ return await this._req(store,'readonly',st=>st.getAll()); }catch(e){ return Array.from(this.mem[store].values()); } },
  async keys(store){ if(!this.ok) return Array.from(this.mem[store].keys()); try{ return await this._req(store,'readonly',st=>st.getAllKeys()); }catch(e){ return []; } },
};

const RT = { mode:'local', standalone: !(window.claude && typeof window.claude.use==='function'), signedOut:false, db:null, assets:null, user:null, downloads:null, sample:null, sampleImages:null, me:{id:null,name:'',isOwner:false,canEdit:false}, canWrite:null, online:navigator.onLine!==false, assetUrls:{} };
async function initRuntime(){

/* ===================== 저장소 + 동기화 ===================== */
const Store = {
  recs:new Map(),           // path -> {path,data,base,dirty,deleted,needsAsset,ver,err,attempts}
  facilities:new Map(), inspections:new Map(), photos:new Map(), settings:{standards:null, access:null},
  blobUrls:new Map(),       // photoId -> objectURL
  listeners:new Set(), flushing:false, flushTimer:null, backoff:0, lastSavedAt:null, conflicts:[],
  localName:'', unsubs:[], photoSubInspection:null, photoUnsub:null, ready:false,
  on(fn){ this.listeners.add(fn); return ()=>this.listeners.delete(fn); },
  emit(what){ for(const fn of this.listeners){ try{ fn(what); }catch(e){ console.error(e); } } },
  split(path){ const i=path.indexOf('/'); return [path.slice(0,i), path.slice(i+1)]; },
  applyToMaps(path, data){
    const [col,id]=this.split(path);
    const map = col==='facilities'?this.facilities: col==='inspections'?this.inspections: col==='photos'?this.photos: null;
    if (map){ if(data) map.set(id, data); else map.delete(id); }
    else if (col==='settings'){ this.settings[id]=data; }
  },
  async loadLocal(){
    try{ const nm=await IDB.get('meta','localName'); if(nm) this.localName=nm; }catch(e){}
    const all = await IDB.all('docs');
    for (const r of all){ this.recs.set(r.path, r); if(!r.deleted) this.applyToMaps(r.path, r.data); }
    // 로컬 블롭 URL 준비
    const keys = await IDB.keys('blobs');
    for (const k of keys){ const b=await IDB.get('blobs',k); if(b) this.blobUrls.set(k, URL.createObjectURL(b)); }
    this.ready=true; this.emit('load');
  },
  async persist(rec){ await IDB.put('docs', {path:rec.path,data:rec.data,base:rec.base,dirty:rec.dirty,deleted:!!rec.deleted,needsAsset:!!rec.needsAsset,ver:rec.ver||0}); },
  get(path){ const r=this.recs.get(path); return r && !r.deleted ? r.data : null; },
  /** 저장(즉시 로컬 임시저장 → 동기화 큐) */
  async save(path, data, opts={}){
    let rec=this.recs.get(path);
    if(!rec){ rec={path, data:null, base:null, dirty:false, ver:0}; this.recs.set(path,rec); }
    if (Object.isFrozen(data)) data = clone(data);
    if(!opts.silent){ data.updatedAt = nowIso(); data.updatedBy = myId(); }
    rec.data=data; rec.dirty=true; rec.deleted=false; rec.ver=(rec.ver||0)+1; rec.err=null;
    if (opts.needsAsset!==undefined) rec.needsAsset=opts.needsAsset;
    this.applyToMaps(path, data);
    this.emit('change:'+path);
    SyncUI.update();
    await this.persist(rec);
    this.scheduleFlush(0);
  },
  async remove(path){
    let rec=this.recs.get(path); if(!rec){ rec={path,data:null,base:null,ver:0}; this.recs.set(path,rec); }
    rec.deleted=true; rec.dirty=true; rec.ver=(rec.ver||0)+1; rec.needsAsset=false;
    this.applyToMaps(path,null); this.emit('change:'+path); SyncUI.update();
    await this.persist(rec); this.scheduleFlush(0);
  },
  pendingCount(){ let n=0; for(const r of this.recs.values()) if(r.dirty && !r.needsAsset) n++; return n; },
  failedCount(){ let n=0; for(const r of this.recs.values()) if(r.dirty && r.err && !r.needsAsset) n++; return n; },
  scheduleFlush(ms){ clearTimeout(this.flushTimer); this.flushTimer=setTimeout(()=>this.flush(), ms); },
  async flush(){
    if (this.flushing) { this.scheduleFlush(500); return; }
    this.flushing=true; SyncUI.update();
    try{
      const dirty=[...this.recs.values()].filter(r=>r.dirty && !r.needsAsset);
      if (RT.mode==='local'){ for(const r of dirty){ r.err=null; } if(dirty.length) this.lastSavedAt=Date.now(); }
      else if (!RT.db || RT.canWrite===false){ /* 로그인/쓰기 권한 없음: 대기 */ }
      else {
        let anyFail=false;
        for (const r of dirty){
          const verAtStart=r.ver;
          try{
            const ref=RT.db.doc(r.path);
            if (r.deleted){ await ref.delete(); }
            else {
              const snap=await ref.get(); const serverNow=snap.exists? snap.data(): null;
              const {out,conflicts}=merge3(r.base, r.data, serverNow);
              out.rev = Math.max((serverNow&&serverNow.rev)||0, r.data.rev||0)+1;
              await ref.set(out);
              if (r.ver===verAtStart){ Object.keys(r.data).forEach(k=>{ if(!(k in out)) delete r.data[k]; }); Object.assign(r.data, out); this.applyToMaps(r.path,r.data); }
              r.base=clone(out);
              if (conflicts.length){ this.conflicts.push({path:r.path, fields:conflicts, at:Date.now()}); toast(`다른 기기의 수정과 충돌해 내 입력을 유지했습니다 (${conflicts.slice(0,3).join(', ')})`, {ms:6000}); }
            }
            if (r.ver===verAtStart){ r.dirty=false; r.err=null; r.attempts=0; }
            this.lastSavedAt=Date.now(); RT.online=true;
            await this.persist(r);
            this.emit('synced:'+r.path);
          }catch(e){
            anyFail=true; r.err=(e&&e.code)||'error'; r.attempts=(r.attempts||0)+1; await this.persist(r);
            if (r.err==='invalid_argument' || r.err==='quota_exceeded'){ console.warn('save rejected', r.path, e); }
            else if (r.err==='unavailable' || r.err==='error') RT.online = navigator.onLine!==false ? RT.online : false;
          }
        }
        if (anyFail){ this.backoff=Math.min(60000, (this.backoff||3000)*2); this.scheduleFlush(this.backoff); }
        else this.backoff=0;
      }
    } finally { this.flushing=false; SyncUI.update(); }
    Uploads.run();
  },
  /* 서버 변경 수신 */
  handleServer(path, data){
    let rec=this.recs.get(path);
    if(!rec){ rec={path,data:clone(data),base:clone(data),dirty:false,ver:0}; this.recs.set(path,rec); }
    else if(rec.dirty){ return; /* 플러시 때 3-way 병합 */ }
    else { if (deepEq(rec.base, data)) return; rec.data=clone(data); rec.base=clone(data); rec.deleted=false; }
    this.applyToMaps(path,rec.data); this.persist(rec); this.emit('change:'+path);
  },
  handleServerDelete(path){
    const rec=this.recs.get(path); if(rec && rec.dirty) return;
    this.recs.delete(path); IDB.del('docs',path); this.applyToMaps(path,null); this.emit('change:'+path);
  },
  subscribeCloud(){
    if (!RT.db) return;
    const sub=(q)=>q.onSnapshot(snap=>{
      for (const ch of snap.docChanges()){
        const path=ch.doc.ref? ch.doc.ref.path : null;
        const p = path || (q.path+'/'+ch.doc.id);
        if (ch.type==='removed') this.handleServerDelete(p); else this.handleServer(p, ch.doc.data());
      }
      if (!this.cloudLoaded){ this.cloudLoaded=true; this.emit('load'); }
    }, err=>{ console.warn('subscribe error', err); if(err && err.code==='revoked'){ toast('접근 권한이 변경되어 실시간 동기화가 중단되었습니다. 새로고침해 주세요.',{err:true,ms:8000}); } });
    this.unsubs.push(sub(RT.db.collection('facilities')));
    this.unsubs.push(sub(RT.db.collection('inspections')));
    this.unsubs.push(sub(RT.db.collection('settings')));
  },
  subscribePhotos(inspectionId){
    if (!RT.db || this.photoSubInspection===inspectionId) return;
    if (this.photoUnsub){ this.photoUnsub(); this.photoUnsub=null; }
    this.photoSubInspection=inspectionId;
    if(!inspectionId) return;
    const q=RT.db.collection('photos').where('inspectionId','==',inspectionId);
    this.photoUnsub=q.onSnapshot(snap=>{
      for (const ch of snap.docChanges()){ const p='photos/'+ch.doc.id; if(ch.type==='removed') this.handleServerDelete(p); else this.handleServer(p, ch.doc.data()); }
    }, err=>console.warn('photo sub', err));
  },
  async fetchPhotos(inspectionId){
    if (!RT.db) return;
    try{ const snap=await RT.db.collection('photos').where('inspectionId','==',inspectionId).get(); for(const d of snap.docs) this.handleServer('photos/'+d.id, d.data()); }catch(e){ console.warn(e); }
  },
  photosOf(inspectionId, cat){ const arr=[...this.photos.values()].filter(p=>p.inspectionId===inspectionId && (!cat || p.category===cat)); arr.sort((a,b)=>(a.order||0)-(b.order||0) || (a.createdAt||'').localeCompare(b.createdAt||'')); return arr; },
  inspectionsOf(facilityId){ return [...this.inspections.values()].filter(i=>i.facilityId===facilityId).sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.createdAt||'').localeCompare(a.createdAt||'')); },
};
function merge3(base, local, server){
  if (!server) return {out:clone(local), conflicts:[]};
  if (!base) return {out:Object.assign({}, server, local), conflicts:[]};
  const IGN=new Set(['rev','updatedAt','updatedBy']);
  const out={}, conflicts=[];
  const keys=new Set([...Object.keys(base),...Object.keys(local),...Object.keys(server)]);
  for (const k of keys){
    const b=base[k], l=local[k], s=server[k];
    const lc=!deepEq(l,b), sc=!deepEq(s,b);
    if (!lc){ if (k in server) out[k]=s; else if (!sc && k in local) out[k]=l; }
    else if (!sc){ if (k in local) out[k]=l; }
    else if (k==='editLog' && Array.isArray(l) && Array.isArray(s)){ const seen=new Set(); out[k]=[...s,...l].filter(e=>{ const key=e.at+'|'+e.by; if(seen.has(key)) return false; seen.add(key); return true; }).sort((a,b)=>(a.at||'').localeCompare(b.at||'')).slice(-50); }
    else if (isObj(l)&&isObj(s)&&isObj(b)){ const m=merge3(b,l,s); out[k]=m.out; conflicts.push(...m.conflicts.map(c=>k+'.'+c)); }
    else { if (k in local) out[k]=l; if (!deepEq(l,s) && !IGN.has(k)) conflicts.push(k); }
  }
  return {out, conflicts};
}

/* ===================== 사진 업로드 큐 ===================== */
const Uploads = {
  running:false, uploading:new Set(), nextTry:{}, attempts:{},
  pending(){ return [...Store.photos.values()].filter(p=>!p.assetId && p.status!=='local'); },
  async run(){
    if (this.running) return; this.running=true;
    try{
      for (const p of this.pending()){
        if (this.uploading.has(p.id)) continue;
        const path='photos/'+p.id; const rec=Store.recs.get(path); if(!rec||rec.deleted) continue;
        const blob=await IDB.get('blobs', p.id);
        if (!blob){ if(p.status!=='missing'){ p.status='missing'; rec.data=p; await Store.persist(rec); Store.emit('change:'+path);} continue; }
        if (RT.mode==='local'){ p.status='local'; rec.needsAsset=false; await Store.save(path, p, {silent:true}); continue; }
        if (!RT.assets){ if(p.status!=='noperm'){ p.status='noperm'; rec.data=p; await Store.persist(rec); Store.emit('change:'+path); SyncUI.update(); } continue; }
        if (!RT.online && navigator.onLine===false) continue;
        if (this.nextTry[p.id] && this.nextTry[p.id]>Date.now()) continue;
        this.uploading.add(p.id); p.status='uploading'; Store.emit('change:'+path); SyncUI.update();
        try{
          const r=await RT.assets.upload(blob, {type:'image/jpeg'});
          RT.assetUrls[r.id]=r.url;
          p.assetId=r.id; p.status='done'; p.err=null; rec.needsAsset=false; delete this.nextTry[p.id]; this.attempts[p.id]=0;
          await Store.save(path, p, {silent:true});
          RT.online=true;
        }catch(e){
          p.status='failed'; p.err=(e&&e.code)||'error'; rec.data=p; await Store.persist(rec); Store.emit('change:'+path);
          this.attempts[p.id]=(this.attempts[p.id]||0)+1; this.nextTry[p.id]=Date.now()+Math.min(60000, 4000*Math.pow(2, this.attempts[p.id]-1));
          if (p.err==='store_unavailable' || p.err==='upstream_error' || p.err==='rate_limited') { RT.online = navigator.onLine!==false; }
        } finally { this.uploading.delete(p.id); SyncUI.update(); }
      }
    } finally { this.running=false; }
    // 업로드 완료된 문서 플러시 후 로컬 블롭 정리
    for (const [pid,url] of Store.blobUrls){ const p=Store.photos.get(pid); const rec=Store.recs.get('photos/'+pid); if (p && p.assetId && rec && !rec.dirty && RT.mode==='cloud'){ await IDB.del('blobs',pid); URL.revokeObjectURL(url); Store.blobUrls.delete(pid); } }
  },
  retry(pid){ const p=Store.photos.get(pid); if(!p) return; p.status='pending'; p.err=null; delete this.nextTry[pid]; Store.emit('change:photos/'+pid); this.run(); },
  retryAll(){ this.nextTry={}; for(const p of this.pending()){ if(p.status==='failed') p.status='pending'; } this.run(); },
  countPending(){ return this.pending().filter(p=>p.status!=='noperm').length; },
  countFailed(){ return this.pending().filter(p=>p.status==='failed'||p.status==='missing').length; },
};
function photoSrc(p){ if(!p) return ''; const u=Store.blobUrls.get(p.id); if(u) return u; if(p.assetId) return assetUrl(p.assetId); return ''; }

/* ===================== 동기화 상태 표시 ===================== */
const SyncUI = {
  update(){
    const chip=$('#syncChip'), txt=$('#syncText'); if(!chip) return;
    let cls='sync-ok', t='동기화 완료';
    const pend=Store.pendingCount(), fail=Store.failedCount(), up=Uploads.countPending(), upFail=Uploads.countFailed();
    if (RT.mode==='local'){ cls='sync-local'; t= RT.signedOut? '비로그인 · 이 기기에 저장됨' : '이 기기에 저장됨'; }
    else if (!RT.db){ cls='sync-off'; t='로그인 필요 · 읽기 전용'; }
    else if (RT.canWrite===false){ cls='sync-off'; t='읽기 전용 권한'; }
    else if (navigator.onLine===false){ cls='sync-off'; t=`오프라인 · 임시 보관 ${pend+up}건`; }
    else if (fail||upFail){ cls='sync-bad'; t=`동기화 실패 ${fail+upFail}건 · 재시도 중`; }
    else if (Store.flushing || pend || up){ cls='sync-busy'; t=`동기화 중 ${pend+up}건`; }
    else { cls='sync-ok'; t= Store.lastSavedAt? `동기화 완료 ${new Date(Store.lastSavedAt).toTimeString().slice(0,5)}` : '동기화 완료'; }
    chip.className='chip '+cls; txt.textContent=t;
    const ss=$('#saveState'); if(ss){ ss.className='savestate '+(RT.mode==='local'? 'saved' : fail||upFail?'failed': (pend||up||Store.flushing)? 'saving' : 'saved'); ss.innerHTML = RT.mode==='local'? '기기 저장됨' : fail||upFail? '저장 실패<br>재시도 중' : (pend||up||Store.flushing)? '저장 중…' : '저장 완료'; }
  }
};
window.addEventListener('online', ()=>{ RT.online=true; SyncUI.update(); Store.backoff=0; Uploads.nextTry={}; Store.scheduleFlush(300); toast('연결이 복구되어 동기화를 시작합니다'); });
window.addEventListener('offline', ()=>{ RT.online=false; SyncUI.update(); toast('오프라인 상태입니다. 입력과 사진은 이 기기에 임시 보관됩니다'); });

function startInspection(facId){
  const fac=Store.facilities.get(facId); if(!fac) return;
  if (readOnly()){ toast('읽기 전용 권한이라 점검을 시작할 수 없습니다',{err:true}); return; }
  const drafts=Store.inspectionsOf(facId).filter(i=>i.status==='draft');
  const create=async()=>{ const insp=newInspectionDoc(fac); await Store.save('inspections/'+insp.id, insp); App.go({name:'inspect', id:insp.id, step:1}); };
  if (drafts.length){
    openModal(`<h2>작성 중인 점검이 있습니다</h2><p class="muted">${esc(fac.name)} · ${fmtKDate(drafts[0].date)} 점검이 작성 중입니다.</p><div class="toolbar"><button class="btn primary" id="mContinue">이어서 작성</button><button class="btn" id="mNew">새로 시작</button><button class="btn ghost" id="mClose">취소</button></div>`);

/* ===================== 점검 편집기 ===================== */
const Editor = {
  id:null, changed:new Set(), timer:null, tick:null,
  cur(){ return Store.inspections.get(this.id); },
  touch(field, immediate){ this.changed.add(field); const ss=$('#saveState'); if(ss&&RT.mode==='cloud'){ ss.className='savestate saving'; ss.textContent='저장 중…'; } clearTimeout(this.timer); if(immediate) this.commit(); else this.timer=setTimeout(()=>this.commit(), 500); },
  async commit(){ clearTimeout(this.timer); const insp=this.cur(); if(!insp) return; const fields=[...this.changed]; this.changed.clear(); if(!fields.length) return; if(insp.status==='done') pushEditLog(insp, fields); await Store.save('inspections/'+insp.id, insp); },
};
function pushEditLog(insp, fields){ insp.editLog=insp.editLog||[]; const last=insp.editLog[insp.editLog.length-1]; const now=nowIso(); if(last && last.by===myId() && (Date.now()-new Date(last.at).getTime())<10*60*1000){ last.at2=now; last.fields=[...new Set([...(last.fields||[]),...fields])]; } else insp.editLog.push({at:now, by:myId(), fields:[...new Set(fields)]}); if(insp.editLog.length>50) insp.editLog=insp.editLog.slice(-50); }
function setPath(obj, path, val){ const ks=path.split('.'); let o=obj; for(let i=0;i<ks.length-1;i++){ if(!isObj(o[ks[i]])) o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=val; }
function getPath(obj, path){ return path.split('.').reduce((o,k)=>o==null?undefined:o[k], obj); }
const FIELD_LABELS = {status:'점검 상태(완료 취소)', date:'점검일', inspector:'점검자', inspectorOrg:'소속', companions:'동행자', overall:'종합 의견', actions:'조치 필요사항', actionDue:'조치기한', actionDone:'조치 완료 여부', actionDoneDate:'조치 완료일', photoNA:'사진 미보유 표시', photoReason:'사진 누락 사유', pump:'양수 타이머', photos:'사진'};
function fieldLabel(f){ if(FIELD_LABELS[f]) return FIELD_LABELS[f]; const m=f.match(/^items\.([WF]\d)/); if(m){ const it=buildItems().find(x=>x.id===m[1]); return it? `${it.sec==='written'?'서면':'현장'}${it.num} ${it.title}`: f; } const k=f.split('.')[0]; return FIELD_LABELS[k]||f; }

const STEP_NAMES=['기본정보','서면점검','현장점검','사진','최종 검토'];
function stepState(insp, n){ const s=inspStats(insp); if(n===1) return (insp.date&&insp.inspector)?'done':'partial'; if(n===2){ const arr=['W1','W2','W3','W4','W5'].map(id=>(insp.items[id]||{}).r); return arr.every(Boolean)?'done': arr.some(Boolean)?'partial':''; } if(n===3){ const arr=['F1','F2','F3','F4','F5','F6','F7','F8'].map(id=>(insp.items[id]||{}).r); return arr.every(Boolean)?'done': arr.some(Boolean)?'partial':''; } if(n===4){ const cov=photoCoverage(insp); return cov.every(c=>c.ok)?'done': cov.some(c=>c.count)?'partial':''; } if(n===5) return insp.status==='done'?'done':''; return ''; }
function photoCoverage(insp){ return PHOTO_CATS.map(c=>{ const ps=Store.photosOf(insp.id,c.id); const na=c.naKey && insp.photoNA && insp.photoNA[c.naKey]; const reason=(insp.photoReason||{})[c.id]||''; return {cat:c, count:ps.length, na:!!na, reason, cover:ps.find(p=>p.isCover)||ps[0]||null, ok: ps.length>0 || !!na || !!reason.trim()}; }); }

function renderInspect(route){
  const insp=Store.inspections.get(route.id); const view=$('#view');
  if(!insp){ view.innerHTML=`<div class="empty"><b>점검 기록을 찾을 수 없습니다</b><button class="btn" onclick="App.go({name:'home'})">홈으로</button></div>`; return; }
  Editor.id=insp.id; Store.subscribePhotos(insp.id);
  const step=Math.min(5,Math.max(1, route.step||1));
  if(insp.lastStep!==step && insp.status!=='done'){ insp.lastStep=step; Store.save('inspections/'+insp.id, insp, {silent:true}); }
  const f=insp.facility||{}; const s=inspStats(insp); const ro=readOnly();
  view.innerHTML=`
  <div class="crumbs"><button data-go="home">홈</button><span>›</span><button data-fac="${insp.facilityId}">${esc(f.name||'시설')}</button><span>›</span><span>${fmtKDate(insp.date)} 점검</span></div>
  <div class="pagehead" style="margin-bottom:10px"><div><h1 style="font-size:20px">${f.isTest?'<span class="tag test">테스트</span> ':''}${esc(f.name||'')}</h1><p class="sub">${esc(f.gu||'')} · ${esc(f.address||'')}</p></div>
    <div class="row">${insp.status==='done'? `<span class="tag good" style="font-size:13px;padding:4px 10px">점검 완료</span>`:`<span class="tag warn" style="font-size:13px;padding:4px 10px">작성 중</span>`}<button class="btn sm" id="toReport">보고서</button></div></div>
  ${insp.status==='done'? `<div class="alert info small" style="margin-bottom:10px">점검 완료된 기록입니다. 내용을 수정하면 수정일시와 수정자가 기록됩니다.${(insp.editLog||[]).length? ` 최근 수정: ${fmtDT((insp.editLog[insp.editLog.length-1].at2||insp.editLog[insp.editLog.length-1].at))}`:''}</div>`:''}
  ${ro? `<div class="alert warn small" style="margin-bottom:10px">읽기 전용 권한입니다. 입력 내용은 저장되지 않습니다.</div>`:''}
  <div class="progress" aria-label="점검 진행률"><i style="width:${Math.round(s.done/s.total*100)}%"></i></div>
  <div class="steps" role="tablist" style="margin-top:10px">${STEP_NAMES.map((n,i)=>`<button type="button" data-step="${i+1}" class="${stepState(insp,i+1)}" ${step===i+1?'aria-current="step"':''}><span class="n">${i+1}</span>${n}</button>`).join('')}</div>
  <div id="stepBody">${stepHtml(insp, step)}</div>`;
  $$('#view [data-go]').forEach(b=>b.onclick=()=>App.go({name:b.dataset.go}));
  $$('#view [data-fac]').forEach(b=>b.onclick=()=>App.go({name:'facility', id:b.dataset.fac}));
  $$('#view [data-step]').forEach(b=>b.onclick=()=>{ Editor.commit(); App.go({name:'inspect', id:insp.id, step:+b.dataset.step}); });
  $('#toReport').onclick=()=>{ Editor.commit(); App.go({name:'report', id:insp.id}); };
  bindStep(insp, step);
  renderBottomBar(insp, step);
  if (route.focusItem){ const el=$('#item-'+route.focusItem); if(el){ el.scrollIntoView({block:'center'}); el.querySelector('textarea,input,button')?.focus(); } route.focusItem=null; }
}
function renderBottomBar(insp, step){
  const done=insp.status==='done';
  $('#bottombar').innerHTML=`<div class="bottombar"><div class="bottombar-in">
    <button class="btn" id="prevStep" ${step===1?'disabled':''}>이전</button>
    <div class="savestate" id="saveState">저장됨</div>
    ${step<5? `<button class="btn primary" id="nextStep">다음</button>` : done? `<button class="btn primary" id="viewReport">보고서 보기</button>` : `<button class="btn primary" id="completeBtn">점검 완료</button>`}
  </div></div>`;
  $('#prevStep').onclick=()=>{ Editor.commit(); App.go({name:'inspect', id:insp.id, step:step-1}); };
  const nx=$('#nextStep'); if(nx) nx.onclick=()=>{ Editor.commit(); App.go({name:'inspect', id:insp.id, step:step+1}); };
  const vr=$('#viewReport'); if(vr) vr.onclick=()=>{ Editor.commit(); App.go({name:'report', id:insp.id}); };
  const cb=$('#completeBtn'); if(cb) cb.onclick=()=>completeInspection(insp.id);
  SyncUI.update();
}

function stepHtml(insp, step){
  switch(step){ case 1: return basicHtml(insp); case 2: return checklistHtml(insp,'written'); case 3: return checklistHtml(insp,'field'); case 4: return photosHtml(insp); case 5: return reviewHtml(insp); } return '';
}
/* ---- 1. 기본정보 ---- */

    ${changed? `<div class="alert warn small" style="margin-top:10px"><span>시설정보가 등록 당시와 달라졌습니다. 이 점검에 최신 시설정보를 반영하려면 누르세요.</span><button class="btn sm" data-act="refresh-fac">최신 정보 반영</button></div>`:''}

function canDeleteInspection(insp){ if (readOnly()) return false; return isAdmin() || insp.status!=='done' || insp.createdBy===myId(); }
function manageHtml(insp){ const ps=Store.photosOf(insp.id).length;

    <div class="row between"><div class="small"><b>이 점검 기록 삭제</b><br><span class="muted">점검표 입력과 사진 ${ps}장이 함께 삭제되며 되돌릴 수 없습니다.${insp.status==='done' && !isAdmin()? ' 완료된 기록은 작성자 본인 또는 관리자만 삭제할 수 있습니다.':''}</span></div><button class="btn sm danger" data-act="delete-insp" ${canDeleteInspection(insp)?'':'disabled'}>기록 삭제</button></div>
  </div>`; }
async function deleteInspection(id){ const insp=Store.inspections.get(id); if(!insp) return; const f=insp.facility||{}; const ps=Store.photosOf(id);
  openModal(`<h2>점검 기록을 삭제할까요?</h2><p>${esc(f.name||'')} · ${fmtKDate(insp.date)} · ${insp.status==='done'?'점검 완료':'작성 중'}</p><p class="small muted">점검표 입력 내용과 사진 ${ps.length}장이 함께 삭제됩니다. 삭제한 기록은 복구할 수 없습니다. 보관이 필요하면 먼저 ‘보고서 → 자료 내보내기(ZIP)’로 저장하세요.</p><div class="toolbar"><button class="btn" id="mClose">취소</button><button class="btn danger" id="mDel">삭제</button></div>`, {sticky:true});

}
function reopenInspection(id){ const insp=Store.inspections.get(id); if(!insp||insp.status!=='done') return; insp.status='draft'; insp.reopenedAt=nowIso(); insp.reopenedBy=myId(); insp.lastStep=1; pushEditLog(insp,['status']); Store.save('inspections/'+insp.id, insp); toast('작성 중 상태로 되돌렸습니다. 수정 후 다시 ‘점검 완료’를 누르세요.'); App.go({name:'inspect', id, step:1}); }
function stripMeta(o){ const c=Object.assign({},o); delete c.updatedAt; delete c.updatedBy; delete c.rev; return c; }

/* ---- 2·3. 점검표 ---- */
function checklistHtml(insp, sec){ const st=Object.assign({}, DEFAULT_STANDARDS, Store.settings.standards||{}); const items=buildItems(st).filter(i=>i.sec===sec);
  return `
  ${sec==='written'? `<div class="alert na small" style="margin-bottom:12px"><span>수질검사 주기 등 기준: ${esc(st.year)}년 기준 · ${esc(st.notice)}</span></div>` : `<div class="alert na small" style="margin-bottom:12px"><span>체크 → 미흡 내용 입력 → 사진 촬영 순서로 이어서 작업할 수 있습니다. 미흡은 사유 입력이 필수입니다.</span></div>`}
  <h2 style="font-size:17px;margin-bottom:10px">[${sec==='written'?'서면점검':'현장점검'}] 시설 점검 및 관리</h2>
  <div class="stack">${items.map(it=>itemHtml(insp,it)).join('')}</div>`; }
function itemHtml(insp, it){ const v=insp.items[it.id]||{r:'',note:'',auto:false}; const r=v.r||'';
  return `<section class="item ${r}" data-item="${it.id}" id="item-${it.id}">
    <div class="ihead"><span class="num">${it.num}</span><div class="t"><h3>${esc(it.title)}</h3>${it.note?`<p class="note">${esc(it.note)}</p>`:''}</div><span class="state tag ${r||'none'}">${RESULT_LABEL[r]}</span></div>
    ${v.auto? `<div class="auto">자동 설정 · ${esc(v.note)} <span class="small" style="font-weight:500">(시설정보 기준, 변경 가능)</span></div>`:''}
    <div class="seg" role="group" aria-label="${esc(it.title)} 점검 결과">
      <button type="button" class="good" data-act="result" data-val="good" aria-pressed="${r==='good'}">양호</button>
      <button type="button" class="poor" data-act="result" data-val="poor" aria-pressed="${r==='poor'}">미흡</button>
      <button type="button" class="na" data-act="result" data-val="na" aria-pressed="${r==='na'}">해당 없음</button>
    </div>
    ${r==='poor'? `<div class="field"><label>미흡 내용 <span class="req">*필수</span></label><textarea data-field="items.${it.id}.note" class="${(v.note||'').trim()?'':'invalid'}" placeholder="미흡한 내용을 구체적으로 적어 주세요 (보고서의 ‘미흡 내용’란에 출력)">${esc(v.note||'')}</textarea></div>`:''}
    ${r==='na'? `<div class="field"><label>해당 없음 사유 <span class="req">*필수</span></label><input type="text" data-field="items.${it.id}.note" value="${esc(v.note||'')}" class="${(v.note||'').trim()?'':'invalid'}" placeholder="예: 비상발전기 미보유 (보고서 비고에 표시)"></div>`:''}
    ${it.timer? timerHtml(insp): ''}
    ${it.photo? photoRowHtml(insp, it.photo): ''}
  </section>`; }
function timerHtml(insp){ const t=insp.pump||{}; const running=t.startedAt && !t.endedAt; const elapsed = t.endedAt? Math.round((new Date(t.endedAt)-new Date(t.startedAt))/1000) : running? Math.round((Date.now()-new Date(t.startedAt))/1000) : 0; const remain=Math.max(0, PUMP_SECONDS-elapsed);
  return `<div class="timer" id="pumpTimer"><div class="small muted" style="text-align:center">양수작업 3분 타이머 · 종료되어도 결과는 직접 선택합니다</div>
    <div class="clock ${running?'running':''} ${elapsed>=PUMP_SECONDS?'done':''}" id="pumpClock">${pad(Math.floor(remain/60))}:${pad(remain%60)}</div>
    <div class="tbtns">${running? `<button class="btn" data-act="timer-stop">정지</button>` : `<button class="btn primary" data-act="timer-start" ${t.endedAt?'disabled':''}>시작</button>`}<button class="btn" data-act="timer-reset" ${t.startedAt?'':'disabled'}>초기화</button></div>
    <div class="log" id="pumpLog">${t.startedAt? `시작 ${fmtTime(t.startedAt)}${t.endedAt? ` · 정지 ${fmtTime(t.endedAt)} · 실제 확인시간 ${Math.floor(elapsed/60)}분 ${elapsed%60}초${elapsed>=PUMP_SECONDS?' (3분 이상 확인)':' (3분 미만)'}`:' · 진행 중'}`:'기록 없음'}</div></div>`; }
function photoRowHtml(insp, cat){ const c=CAT_BY_ID[cat]; const ps=Store.photosOf(insp.id, cat); const na=c.naKey && insp.photoNA && insp.photoNA[c.naKey];
  return `<div class="photorow"><span class="small muted" style="flex:1 1 100%">관련 사진 → <b>${esc(c.short||c.label)}</b> ${ps.length?`(${ps.length}장)`:''}${na?' · <span class="tag na">미보유</span>':''}</span>
    ${na?'':`<button class="btn sm" data-act="photo-camera" data-cat="${cat}">📷 촬영</button><button class="btn sm" data-act="photo-album" data-cat="${cat}">앨범</button>`}
    <div class="thumbs" style="display:flex">${ps.slice(0,6).map(p=>thumbHtml(p,{sm:true})).join('')}</div></div>`; }
function thumbHtml(p, opts={}){ const src=photoSrc(p); const rot=((p.rotation||0)%360+360)%360; const cls='thumb'+(opts.sm?' sm':'')+(rot?` r${rot}`:'');
  const st = (p.status==='failed'||p.status==='missing')? '<span class="badge fail">실패</span>' : (p.status==='noperm'&&RT.mode==='cloud')? '<span class="badge fail">권한</span>' : ((p.status==='pending'||p.status==='uploading')&&RT.mode==='cloud')? '<span class="badge pend">대기</span>' : '';
  return `<button type="button" class="${cls}" data-act="photo-open" data-pid="${p.id}" aria-label="사진 보기">${src?`<img src="${esc(src)}" alt="" loading="lazy">`:'<div class="noimg">이미지 없음</div>'}${p.isCover&&!opts.sm?'<span class="badge cover">대표</span>':''}${st}${!opts.sm&&p.caption?`<span class="cap">${esc(p.caption)}</span>`:''}</button>`; }

  <section class="pcat"><div class="phead"><h3>여러 장 한 번에 올리기</h3><span class="n">미분류 ${unclassified.length}장</span></div>

    <div id="aiStatus" class="small muted"></div>
    ${unclassified.length? `<div class="list">${unclassified.map(p=>`<div class="review-row" data-unc="${p.id}"><div style="width:72px;flex:none">${thumbHtml(p,{sm:true})}</div><div class="t"><b class="small">${fmtDT(p.takenAt)} <span class="muted">(${p.takenSrc==='camera'?'촬영':p.takenSrc==='exif'?'EXIF':'파일 일시'})</span></b><span id="ai-${p.id}" class="small">${p.aiSuggest? `AI 추천: ${esc(CAT_BY_ID[p.aiSuggest]?CAT_BY_ID[p.aiSuggest].label:'미분류')} (${Math.round((p.aiConf||0)*100)}%)`:''}</span></div>
      <select data-act="assign-cat" data-pid="${p.id}" aria-label="구분 선택"><option value="none">미분류</option>${PHOTO_CATS.map(c=>`<option value="${c.id}" ${p.aiSuggest===c.id?'selected':''}>${esc(c.short||c.label)}</option>`).join('')}</select>
      <button class="btn sm" data-act="apply-cat" data-pid="${p.id}">적용</button></div>`).join('')}</div>`:''}
  </section>
  </div>`; }

/* ---- 5. 최종 검토 ---- */
function reviewHtml(insp){ const s=inspStats(insp); const items=buildItems(Store.settings.standards); const f=insp.facility||{};
  const poorItems=items.filter(it=>(insp.items[it.id]||{}).r==='poor'); const noneItems=items.filter(it=>!(insp.items[it.id]||{}).r); const missing=items.filter(it=>{ const v=insp.items[it.id]||{}; return (v.r==='poor'||v.r==='na') && !(v.note||'').trim(); });
  const cov=photoCoverage(insp); const unc=Store.photosOf(insp.id,'none').length; const pendingUp=Store.photosOf(insp.id).filter(p=>!p.assetId && p.status!=='local').length;
  const blocking=noneItems.length+missing.length;
  return `

/* ---- 이벤트 바인딩 ---- */
function bindStep(insp, step){
  const body=$('#stepBody'); if(!body) return;
  body.addEventListener('input', e=>{ const el=e.target; const f=el.dataset.field; if(!f) return; const cur=Editor.cur(); if(!cur) return; let v = el.type==='checkbox'? el.checked : el.value; setPath(cur, f, v); if(el.classList.contains('invalid') && String(v).trim()) el.classList.remove('invalid'); Editor.touch(f, el.type==='checkbox'||el.type==='date');
    if (f.startsWith('items.')){ const id=f.split('.')[1]; const sec=$('#item-'+id); if(sec){ const tag=$('.state',sec); } }
    if (f==='actionDone'){ scheduleRender(); }
    if (f.startsWith('photoReason.')) { /* no rerender */ }
  });
  body.addEventListener('change', e=>{ const el=e.target; if(el.dataset.act==='photo-na'){ const cur=Editor.cur(); cur.photoNA=cur.photoNA||{}; cur.photoNA[el.dataset.key]=el.checked; cur.photoNAauto=cur.photoNAauto||{}; cur.photoNAauto[el.dataset.key]=false; Editor.touch('photoNA', true); render(); } });
  body.addEventListener('click', async e=>{ const b=e.target.closest('[data-act],[data-jump]'); if(!b) return; const cur=Editor.cur(); if(!cur) return;
    if (b.dataset.jump){ Editor.commit(); App.go({name:'inspect', id:cur.id, step:+b.dataset.jump, focusItem:b.dataset.focus||null}); return; }
    const act=b.dataset.act;
    if (act==='result'){ const sec=b.closest('[data-item]'); const id=sec.dataset.item; const v=cur.items[id]||(cur.items[id]={r:'',note:'',auto:false}); if (readOnly()){ toast('읽기 전용 권한입니다',{err:true}); return; } v.r = v.r===b.dataset.val? '' : b.dataset.val; v.auto=false; Editor.touch('items.'+id, true); const it=buildItems(Store.settings.standards).find(x=>x.id===id); sec.outerHTML=itemHtml(cur,it); const nb=$('#item-'+id); const ta=$('textarea,input[type=text]',nb); if(ta && v.r!=='good') ta.focus(); updateStepsBar(cur); return; }
    if (act==='refresh-fac'){ const live=Store.facilities.get(cur.facilityId); if(live){ cur.facility=clone(live); if(!live.generator){ for(const id of ['F6','F7']){ const v=cur.items[id]; if(!v.r||v.auto){ cur.items[id]={r:'na',note:'비상발전기 미보유',auto:true}; } } } Editor.touch('facility', true); toast('최신 시설정보를 반영했습니다'); render(); } return; }
    if (act==='photo-camera'||act==='photo-album'){ if (readOnly()){ toast('읽기 전용 권한입니다',{err:true}); return; } pickFiles(cur.id, b.dataset.cat, act==='photo-camera'?'camera':'album'); return; }
    if (act==='photo-bulk'){ if (readOnly()){ toast('읽기 전용 권한입니다',{err:true}); return; } pickFiles(cur.id, 'none', 'album', true); return; }
    if (act==='photo-open'){ openPhoto(b.dataset.pid); return; }
    if (act==='timer-start'){ cur.pump={startedAt:nowIso(), endedAt:null, elapsed:0}; Editor.touch('pump', true); refreshTimer(true); return; }
    if (act==='timer-stop'){ cur.pump.endedAt=nowIso(); cur.pump.elapsed=Math.round((new Date(cur.pump.endedAt)-new Date(cur.pump.startedAt))/1000); Editor.touch('pump', true); refreshTimer(true); return; }
    if (act==='timer-reset'){ if(b.dataset.arm){ cur.pump={startedAt:null,endedAt:null,elapsed:0}; Editor.touch('pump', true); refreshTimer(true); } else { b.dataset.arm='1'; b.textContent='초기화 확인'; setTimeout(()=>{ delete b.dataset.arm; b.textContent='초기화'; },3000); } return; }
    if (act==='apply-cat'){ const sel=$(`select[data-pid="${b.dataset.pid}"]`, body); const p=Store.photos.get(b.dataset.pid); if(p&&sel){ p.category=sel.value; delete p.aiSuggest; delete p.aiConf; p.order=Store.photosOf(cur.id, sel.value).length; p.isCover = p.order===0; await Store.save('photos/'+p.id, p); toast(sel.value==='none'?'미분류로 두었습니다':`‘${CAT_BY_ID[sel.value].short||CAT_BY_ID[sel.value].label}’로 분류했습니다`); render(); } return; }
    if (act==='ai-classify'){ aiClassify(cur.id); return; }
    if (act==='delete-insp'){ if(canDeleteInspection(cur)) deleteInspection(cur.id); else toast('삭제 권한이 없습니다',{err:true}); return; }
    if (act==='reopen'){ if(readOnly()){ toast('읽기 전용 권한입니다',{err:true}); return; } reopenInspection(cur.id); return; }
  });
  if (step===3){ clearInterval(Editor.tick); Editor.tick=setInterval(refreshTimer, 1000); } else clearInterval(Editor.tick);
  resolveNames(body);
}
function updateStepsBar(insp){ $$('#view [data-step]').forEach(b=>{ b.className=stepState(insp,+b.dataset.step); }); const s=inspStats(insp); const pr=$('#view .progress>i'); if(pr) pr.style.width=Math.round(s.done/s.total*100)+'%'; }
let timerToasted=false;
function refreshTimer(full){ const cur=Editor.cur(); const box=$('#pumpTimer'); if(!cur||!box) return; const t=cur.pump||{}; const running=t.startedAt && !t.endedAt; if (full===true){ timerToasted=false; box.outerHTML=timerHtml(cur); return; } if (running){ const elapsed=Math.round((Date.now()-new Date(t.startedAt))/1000); const remain=Math.max(0,PUMP_SECONDS-elapsed); const c=$('#pumpClock'); if(c){ c.textContent=`${pad(Math.floor(remain/60))}:${pad(remain%60)}`; c.classList.toggle('done', elapsed>=PUMP_SECONDS); } const lg=$('#pumpLog'); if(lg) lg.textContent=`시작 ${fmtTime(t.startedAt)} · 진행 중 ${Math.floor(elapsed/60)}분 ${elapsed%60}초`; if(elapsed>=PUMP_SECONDS && !timerToasted){ timerToasted=true; toast('3분이 지났습니다. 양수 상태를 확인하고 결과를 직접 선택하세요.'); } }
  else { timerToasted=false; box.outerHTML=timerHtml(cur); } }

/* ---- 사진 선택/추가 ---- */
function pickFiles(inspectionId, cat, mode, multiple){
  const key=`${cat}|${mode}|${multiple?'m':'s'}`; let inp=$(`#fileInputs input[data-key="${key}"]`);
  if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.dataset.key=key; if(mode==='camera') inp.setAttribute('capture','environment'); if(multiple||mode==='album') inp.multiple=true; $('#fileInputs').appendChild(inp); }
  inp.onchange=async()=>{ const files=Array.from(inp.files||[]); inp.value=''; if(!files.length) return; await addPhotos(files, {inspectionId, category:cat, source:mode}); };
  inp.click();
}
async function addPhotos(files, ctx){
  const insp=Store.inspections.get(ctx.inspectionId); if(!insp){ toast('점검 기록을 찾을 수 없습니다',{err:true}); return; }
  const existing=Store.photosOf(insp.id); let added=0;
  if (files.length>1) toast(`사진 ${files.length}장을 처리하는 중…`);
  for (const f of files){
    const sig=`${f.name}|${f.size}|${f.lastModified}`;
    if (ctx.source!=='camera' && existing.some(p=>p.fileSig===sig)){ toast(`이미 추가된 사진은 건너뜁니다: ${f.name}`); continue; }
    let pr; try{ pr=await processImage(f); }catch(e){ toast(`이미지를 처리할 수 없습니다: ${f.name}`,{err:true}); continue; }
    let takenAt, takenSrc; if (ctx.source==='camera'){ takenAt=nowIso(); takenSrc='camera'; } else { const ex=await readExifDate(f); if(ex){ takenAt=ex; takenSrc='exif'; } else { takenAt=new Date(f.lastModified||Date.now()).toISOString(); takenSrc='file'; } }
    const id=uuid(); await IDB.put('blobs', pr.blob, id); Store.blobUrls.set(id, URL.createObjectURL(pr.blob));
    const order=Store.photosOf(insp.id, ctx.category).length;
    const p={id, facilityId:insp.facilityId, inspectionId:insp.id, category:ctx.category||'none', assetId:null, status:'pending', caption:'', takenAt, takenSrc, rotation:0, order, isCover: ctx.category!=='none' && order===0, w:pr.w, h:pr.h, sizeBytes:pr.blob.size, fileSig:sig, createdAt:nowIso(), createdBy:myId()};
    await Store.save('photos/'+id, p, {needsAsset:true}); added++;
  }
  if (added){ const c=CAT_BY_ID[ctx.category]; toast(`${added}장을 ${c? '‘'+(c.short||c.label)+'’에' : '미분류로'} 추가했습니다`); if(insp.status==='done'){ pushEditLog(insp,['photos']); Store.save('inspections/'+insp.id, insp); } }
  Uploads.run(); render();
}
async function deletePhoto(pid, opts={}){ const p=Store.photos.get(pid); if(!p) return; const url=Store.blobUrls.get(pid); if(url){ URL.revokeObjectURL(url); Store.blobUrls.delete(pid); } await IDB.del('blobs',pid); await Store.remove('photos/'+pid); if (p.assetId && RT.assets){ RT.assets.delete(p.assetId).catch(()=>{}); } if(p.isCover){ const rest=Store.photosOf(p.inspectionId,p.category); if(rest[0]){ rest[0].isCover=true; await Store.save('photos/'+rest[0].id, rest[0]); } } if(!opts.silent){ const insp=Store.inspections.get(p.inspectionId); if(insp&&insp.status==='done'){ pushEditLog(insp,['photos']); Store.save('inspections/'+insp.id, insp); } } }

/* ---- 사진 확대 보기 ---- */
function openPhoto(pid){
  const p=Store.photos.get(pid); if(!p) return; const list=Store.photosOf(p.inspectionId, p.category); const idx=list.findIndex(x=>x.id===pid); const rot=((p.rotation||0)%360+360)%360; const c=CAT_BY_ID[p.category];
  const stText = p.status==='failed'? `업로드 실패(${esc(p.err||'')}) — 재시도하세요` : p.status==='missing'? '원본이 이 기기에 없고 업로드도 되지 않았습니다(다른 기기에서 촬영)' : p.status==='noperm'? '업로드 권한이 없어 이 기기에만 저장됨' : p.status==='uploading'? '업로드 중…' : p.status==='pending'? (RT.mode==='cloud'?'업로드 대기(연결 시 자동 업로드)':'이 기기에 저장됨') : p.status==='local'? '이 기기에 저장됨' : '저장 완료';
  openModal(`
    <div class="row between"><h2>${esc(c?c.label:'미분류')} ${list.length>1?`<span class="small muted">${idx+1}/${list.length}</span>`:''}</h2><button class="btn sm" id="mClose">닫기</button></div>
    <div class="viewer ${rot?'r'+rot:''}">${photoSrc(p)?`<img src="${esc(photoSrc(p))}" alt="">`:'<div class="noimg" style="color:#fff">이미지를 불러올 수 없습니다</div>'}</div>
    <div class="small muted">촬영일시 ${fmtDTS(p.takenAt)} <span class="tag ${p.takenSrc==='camera'?'good':p.takenSrc==='exif'?'info':'none'}">${p.takenSrc==='camera'?'직접 촬영':p.takenSrc==='exif'?'사진 EXIF':'파일 수정일시'}</span> · ${stText}</div>
    <div class="field"><label for="pcap">사진 설명</label><input id="pcap" type="text" value="${esc(p.caption||'')}" placeholder="보고서에 함께 출력됩니다"></div>
    <div class="toolbar">
      <button class="btn" id="pPrev" ${idx<=0?'disabled':''}>◀ 이전</button><button class="btn" id="pNext" ${idx>=list.length-1?'disabled':''}>다음 ▶</button>
      <button class="btn" id="pRot">↻ 회전</button><button class="btn ${p.isCover?'primary':''}" id="pCover">${p.isCover?'대표사진 ✓':'대표사진으로'}</button>
      <button class="btn" id="pUp" ${idx<=0?'disabled':''}>순서 ▲</button><button class="btn" id="pDown" ${idx>=list.length-1?'disabled':''}>순서 ▼</button>
    </div>
    <div class="row"><label class="small muted" for="pMove">다른 구분으로 이동</label><select id="pMove" style="flex:1;min-width:160px"><option value="none" ${p.category==='none'?'selected':''}>미분류</option>${PHOTO_CATS.map(x=>`<option value="${x.id}" ${x.id===p.category?'selected':''}>${esc(x.short||x.label)}</option>`).join('')}</select>
      ${p.status==='failed'||p.status==='noperm'? `<button class="btn" id="pRetry">업로드 재시도</button>`:''}<button class="btn danger" id="pDel">삭제</button></div>`, {wide:true});
  const save=debounce(async()=>{ const q=Store.photos.get(pid); if(!q) return; await Store.save('photos/'+pid, q); },400);
  $('#mClose').onclick=()=>{ closeModal(); render(); };
  $('#pcap').oninput=e=>{ p.caption=e.target.value; save(); };
  $('#pPrev').onclick=()=>openPhoto(list[idx-1].id); $('#pNext').onclick=()=>openPhoto(list[idx+1].id);
  $('#pRot').onclick=async()=>{ p.rotation=(rot+90)%360; await Store.save('photos/'+pid,p); openPhoto(pid); };
  $('#pCover').onclick=async()=>{ for(const q of list){ if(q.isCover && q.id!==pid){ q.isCover=false; await Store.save('photos/'+q.id,q); } } p.isCover=true; await Store.save('photos/'+pid,p); toast('대표사진으로 지정했습니다'); openPhoto(pid); };
  const swap=async(j)=>{ const other=list[j]; const a=p.order||idx, b=other.order||j; p.order=j; other.order=idx; list.forEach((q,k)=>{ if(q!==p&&q!==other) q.order=k; }); await Store.save('photos/'+other.id, other); await Store.save('photos/'+pid, p); for(const q of list){ if(q!==p&&q!==other) await Store.save('photos/'+q.id,q,{silent:true}); } openPhoto(pid); };
  $('#pUp').onclick=()=>swap(idx-1); $('#pDown').onclick=()=>swap(idx+1);
  $('#pMove').onchange=async e=>{ const to=e.target.value; if(to===p.category) return; const wasCover=p.isCover; p.category=to; p.order=Store.photosOf(p.inspectionId,to).length; p.isCover = to!=='none' && p.order===0; await Store.save('photos/'+pid,p); if(wasCover){ const rest=Store.photosOf(p.inspectionId, list[0].category).filter(q=>q.id!==pid); if(rest[0]){ rest[0].isCover=true; await Store.save('photos/'+rest[0].id, rest[0]); } } toast('사진 구분을 이동했습니다'); closeModal(); render(); };
  const rt=$('#pRetry'); if(rt) rt.onclick=()=>{ Uploads.retry(pid); toast('업로드를 다시 시도합니다'); openPhoto(pid); };
  $('#pDel').onclick=async()=>{ const b=$('#pDel'); if(b.dataset.arm){ await deletePhoto(pid); toast('사진을 삭제했습니다'); closeModal(); render(); } else { b.dataset.arm='1'; b.textContent='삭제 확인'; setTimeout(()=>{ delete b.dataset.arm; b.textContent='삭제'; },3000); } };
}

/* ---- AI 분류 추천 ---- */
async function aiClassify(inspectionId){
  const st=$('#aiStatus'); const unc=Store.photosOf(inspectionId,'none'); if(!unc.length) return;
  if(!RT.sample || !RT.sampleImages){ if(st) st.textContent='이 환경에서는 AI 분류를 사용할 수 없습니다.'; return; }
  const batch=unc.slice(0, Math.max(1, Math.min(RT.sampleImages.maxCount||4, 8)));
  const blobs=[]; const used=[];
  for (const p of batch){ let b=await IDB.get('blobs',p.id); if(!b && p.assetId){ try{ const r=await fetch(assetUrl(p.assetId)); if(r.ok) b=await r.blob(); }catch(e){} } if(b){ blobs.push(b); used.push(p); } }
  if(!blobs.length){ if(st) st.textContent='분류할 이미지를 읽을 수 없습니다.'; return; }
  if(st) st.textContent=`AI가 ${blobs.length}장을 확인하는 중… (첫 사용 시 허용 여부를 묻습니다)`;
  const prompt=`다음 ${blobs.length}장의 사진은 서울시 민방위 비상급수시설 현장점검 사진입니다. 각 사진을 아래 구분 중 하나로 분류하세요.
- sign: 안내표지판(급수시설 안내 표지판, 게시물, 수질검사 게시)
- exterior: 시설 외관(건물·시설물의 외부 전경, 출입문, 펌프실 외부)
- generator: 비상발전기(발전기 장비, 제어반)
- purifier: 정수장치(정수·여과 장비, 필터, 배관)
- pump: 양수 확인(물이 나오는 장면, 수도꼭지·호스에서 물 배출, 양수 작업)
- docs: 서류 배치(점검일지, 수질검사서, 관리카드 등 문서)
확신이 없으면 "unknown"으로 답하세요. 사진 순서대로 JSON 배열만 출력하세요. 예: [{"index":0,"category":"sign","confidence":0.9}]`;
  try{
    const res=await RT.sample.json(prompt, {images:blobs, modelTier:'quick'});
    const arr=Array.isArray(res)?res:[];
    let n=0; for (let i=0;i<used.length;i++){ const r=arr.find(x=>Number(x.index)===i)||arr[i]; const p=used[i]; const cat=r && CAT_BY_ID[String(r.category)]? String(r.category): null; const conf=r? Number(r.confidence)||0 : 0; if(cat && conf>=0.6){ p.aiSuggest=cat; p.aiConf=conf; n++; } else { delete p.aiSuggest; p.aiConf=conf; } const rec=Store.recs.get('photos/'+p.id); if(rec){ rec.data=p; await Store.persist(rec); } }

  }catch(e){ const code=e&&e.code; const msg = code==='not_granted'? 'AI 사용이 허용되지 않아 수동으로 분류해 주세요.' : code==='rate_limited'? '요청이 많아 잠시 후 다시 시도해 주세요.' : code==='image_rejected'? '이미지 형식 문제로 분류하지 못했습니다.' : code==='invalid_json'? 'AI 응답을 해석하지 못했습니다. 다시 시도해 주세요.' : 'AI 분류에 실패했습니다. 수동으로 분류해 주세요.'; if(st) st.textContent=msg; toast(msg,{err:true}); }
}

async function completeInspection(id){

    await paintReportImages($('#reportWrap'));
    const papers=$$('#reportWrap .paper'); const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
    for (let i=0;i<papers.length;i++){
      if(st) st.textContent=`페이지 ${i+1}/${papers.length} 변환 중…`;
      const canvas=await window.html2canvas(papers[i], {scale:2, useCORS:true, allowTaint:false, backgroundColor:'#ffffff', logging:false, scrollX:0, scrollY:-window.scrollY});
      const data=canvas.toDataURL('image/jpeg', 0.9); if(i>0) pdf.addPage(); pdf.addImage(data,'JPEG',0,0,210,297,undefined,'FAST');
    }
    const blob=pdf.output('blob'); const f=insp.facility||{};
    const name=`점검보고서_${(f.gu||'')}_${(f.name||'시설').replace(/[\\/:*?"<>|]/g,'_')}_${insp.date||''}.pdf`;
    if(st) st.textContent=`PDF ${papers.length}쪽 생성 완료 (${(blob.size/1024/1024).toFixed(1)}MB)`;
    window.__lastPdf=blob;
    await saveFile(name, blob);
  }catch(e){ console.error(e); if(st) st.textContent='PDF 생성에 실패했습니다: '+(e.message||e); toast('PDF 생성에 실패했습니다',{err:true}); }
  finally{ Exporting=false; fitReport(); if(btn) btn.disabled=false; }
}

/* ===================== 엑셀 ===================== */
async function exportExcel(insps, baseName){
  if(!insps.length){ toast('내려받을 점검 결과가 없습니다'); return; }
  try{ await loadScript(CDN.xlsx); }catch(e){ toast('엑셀 라이브러리를 불러오지 못했습니다',{err:true}); return; }
  if (RT.mode==='cloud' && insps.length<=20){ for(const i of insps){ if(!Store.photosOf(i.id).length) await Store.fetchPhotos(i.id); } }
  const items=buildItems(Store.settings.standards);
  const head=['자치구','시설명','주소','시설종류','용수 구분','생산량(톤/일)','비상발전기','정수장치','개방 여부','점검일','점검자','소속','동행자','점검 상태', ...items.map(it=>`${it.sec==='written'?'서면':'현장'}${it.num} ${it.title}`), '양호','미흡','해당 없음','미점검','종합 의견','조치 필요사항','조치기한','조치 완료','조치 완료일','양수 확인시간(초)','점검 완료일시','완료 후 수정 횟수','점검 ID','시설 ID','테스트 시설'];
  const sorted=insps.slice().sort((a,b)=>(a.facility&&a.facility.gu||'').localeCompare(b.facility&&b.facility.gu||'')||(b.date||'').localeCompare(a.date||''));
  const rows=sorted.map(i=>{ const f=i.facility||Store.facilities.get(i.facilityId)||{}; const s=inspStats(i); return [f.gu||'', f.name||'', f.address||'', FAC_TYPES[f.type]||'', WATER_USES[f.waterUse]||'', f.capacity!=null?f.capacity:'', f.generator?'유':'무', f.purifier?'유':'무', f.open!==false?'개방':'비개방', i.date||'', i.inspector||'', i.inspectorOrg||'', i.companions||'', i.status==='done'?'점검 완료':'작성 중', ...items.map(it=>RESULT_LABEL[(i.items[it.id]||{}).r||'']), s.good, s.poor, s.na, s.none, i.overall||'', i.actions||'', i.actionDue||'', i.actionDone?'완료':'미완료', i.actionDoneDate||'', i.pump&&i.pump.elapsed||'', i.completedAt?fmtDTS(i.completedAt):'', (i.editLog||[]).length, i.id, i.facilityId, f.isTest?'예':'']; });
  const poorRows=[['점검일','자치구','시설명','구분','번호','항목','결과','미흡 내용 / 해당 없음 사유']];
  for(const i of sorted){ const f=i.facility||{}; for(const it of items){ const v=i.items[it.id]||{}; if(v.r==='poor'||v.r==='na') poorRows.push([i.date||'', f.gu||'', f.name||'', it.sec==='written'?'서면점검':'현장점검', it.num, it.title, RESULT_LABEL[v.r], v.note||'']); } }
  const photoRows=[['점검일','자치구','시설명','사진 구분','대표','설명','촬영일시','촬영일시 출처','회전','저장 상태','사진 ID','점검 ID']];
  for(const i of sorted){ const f=i.facility||{}; for(const p of Store.photosOf(i.id)){ photoRows.push([i.date||'', f.gu||'', f.name||'', p.category==='none'?'미분류':(CAT_BY_ID[p.category]||{}).label||p.category, p.isCover?'대표':'', p.caption||'', fmtDTS(p.takenAt), p.takenSrc==='camera'?'직접 촬영':p.takenSrc==='exif'?'EXIF':'파일 수정일시', p.rotation||0, p.assetId?'업로드 완료':(p.status||''), p.id, p.inspectionId]); } }
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.aoa_to_sheet([head, ...rows]); ws1['!cols']=head.map((h,i)=>({wch: i===2? 30 : (i>=14&&i<27)? 10 : h.length>8? h.length+2 : 12})); ws1['!freeze']={xSplit:2,ySplit:1};
  XLSX.utils.book_append_sheet(wb, ws1, '점검결과');
  const ws2=XLSX.utils.aoa_to_sheet(poorRows); ws2['!cols']=[{wch:11},{wch:9},{wch:28},{wch:9},{wch:5},{wch:36},{wch:9},{wch:60}]; XLSX.utils.book_append_sheet(wb, ws2, '미흡내용');
  const ws3=XLSX.utils.aoa_to_sheet(photoRows); ws3['!cols']=[{wch:11},{wch:9},{wch:28},{wch:16},{wch:5},{wch:30},{wch:20},{wch:12},{wch:5},{wch:12},{wch:22},{wch:22}]; XLSX.utils.book_append_sheet(wb, ws3, '사진목록');
  const out=XLSX.write(wb, {type:'array', bookType:'xlsx'}); const blob=new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  window.__lastXlsx=blob;
  await saveFile(`${(baseName||'점검결과').replace(/[\\/:*?"<>|]/g,'_')}_${todayStr()}.xlsx`, blob);
}


/* ===================== 자료 내보내기 / 가져오기 (ZIP) ===================== */
async function exportPackage(scope={}){
  try{ await loadScript(CDN.jszip); }catch(e){ toast('압축 라이브러리를 불러오지 못했습니다',{err:true}); return; }
  let insps=[...Store.inspections.values()];
  if (scope.inspectionId) insps=insps.filter(i=>i.id===scope.inspectionId);
  else if (scope.facilityId) insps=insps.filter(i=>i.facilityId===scope.facilityId);
  else insps=insps.filter(i=>canSeeGu((Store.facilities.get(i.facilityId)||i.facility||{}).gu));
  const facIds=new Set(insps.map(i=>i.facilityId)); if(scope.facilityId) facIds.add(scope.facilityId);
  let facs=[...Store.facilities.values()].filter(f=>!f.deleted && (scope.inspectionId||scope.facilityId? facIds.has(f.id) : canSeeGu(f.gu)));
  if (RT.mode==='cloud'){ for(const i of insps){ if(!Store.photosOf(i.id).length) await Store.fetchPhotos(i.id); } }
  const photos=[]; for(const i of insps) photos.push(...Store.photosOf(i.id));
  toast(`자료를 묶는 중… (시설 ${facs.length}, 점검 ${insps.length}, 사진 ${photos.length})`);
  const zip=new JSZip(); let missing=0;
  for (const p of photos){ let blob=await IDB.get('blobs',p.id); if(!blob && p.assetId){ try{ const r=await fetch(assetUrl(p.assetId)); if(r.ok) blob=await r.blob(); }catch(e){} } if(blob) zip.file(`photos/${p.id}.jpg`, blob); else missing++; }
  const data={format:'mbw-inspect-package', version:1, exportedAt:nowIso(), exportedBy:myName(), facilities:facs, inspections:insps, photos:photos.map(p=>{ const q=Object.assign({},p); delete q.status; delete q.err; return q; }), settings:{standards:Store.settings.standards||null}};
  zip.file('data.json', JSON.stringify(data, null, 1));
  zip.file('README.txt', '민방위 비상급수시설 점검 앱 자료 묶음입니다.\n앱의 사용자 메뉴 > 자료 가져오기(ZIP)에서 이 파일을 선택하면 시설·점검·사진이 합쳐집니다.\n같은 ID의 기록은 더 최근에 수정된 쪽이 유지됩니다.\n');
  const blob=await zip.generateAsync({type:'blob', compression:'DEFLATE', compressionOptions:{level:6}});
  const base = scope.inspectionId? `점검자료_${((insps[0]||{}).facility||{}).name||''}_${(insps[0]||{}).date||''}` : scope.facilityId? `점검자료_${(Store.facilities.get(scope.facilityId)||{}).name||''}` : '점검자료_전체';
  if (missing) toast(`사진 ${missing}장은 원본을 찾지 못해 제외했습니다`,{ms:5000});
  await saveFile(`${base.replace(/[\\/:*?"<>|]/g,'_')}_${todayStr()}.zip`, blob);
}
async function importPackage(file){
  if (readOnly()){ toast('읽기 전용 권한이라 가져올 수 없습니다',{err:true}); return; }
  try{ await loadScript(CDN.jszip); }catch(e){ toast('압축 라이브러리를 불러오지 못했습니다',{err:true}); return; }
  let zip, data; try{ zip=await JSZip.loadAsync(file); const f=zip.file('data.json'); if(!f) throw new Error('data.json 없음'); data=JSON.parse(await f.async('string')); if(data.format!=='mbw-inspect-package') throw new Error('형식 불일치'); }catch(e){ toast('이 앱의 자료 묶음(ZIP)이 아닙니다: '+e.message,{err:true}); return; }
  const newer=(a,b)=> !b || (a.updatedAt||'') > (b.updatedAt||'');
  let nf=0,ni=0,np=0,skip=0;
  for (const f of data.facilities||[]){ if(!f||!f.id) continue; const cur=Store.facilities.get(f.id); if(!cur || newer(f,cur)){ await Store.save('facilities/'+f.id, f, {silent:true}); nf++; } else skip++; }
  for (const i of data.inspections||[]){ if(!i||!i.id) continue; const cur=Store.inspections.get(i.id); if(!cur || newer(i,cur)){ await Store.save('inspections/'+i.id, i, {silent:true}); ni++; } else skip++; }
  for (const p of data.photos||[]){ if(!p||!p.id) continue; const cur=Store.photos.get(p.id); const zf=zip.file(`photos/${p.id}.jpg`);
    if (cur && cur.assetId){ if(newer(p,cur)){ const merged=Object.assign({}, cur, {caption:p.caption, rotation:p.rotation, order:p.order, isCover:p.isCover, category:p.category, updatedAt:p.updatedAt}); await Store.save('photos/'+p.id, merged, {silent:true}); } skip++; continue; }
    const q=Object.assign({}, p); const hasBlob=!!zf;
    if (hasBlob){ const blob=await zf.async('blob'); const jpg=blob.type? blob : new Blob([blob],{type:'image/jpeg'}); await IDB.put('blobs', jpg, p.id); const old=Store.blobUrls.get(p.id); if(old) URL.revokeObjectURL(old); Store.blobUrls.set(p.id, URL.createObjectURL(jpg)); }
    if (RT.mode==='cloud'){ if(q.assetId && !hasBlob){ q.status='done'; await Store.save('photos/'+p.id, q, {silent:true}); } else { q.assetId=null; q.status='pending'; await Store.save('photos/'+p.id, q, {silent:true, needsAsset:true}); } }
    else { q.assetId=null; q.status= hasBlob? 'local':'missing'; await Store.save('photos/'+p.id, q, {silent:true}); }
    np++;
  }
  if (data.settings && data.settings.standards && !Store.settings.standards && isAdmin()) await Store.save('settings/standards', data.settings.standards, {silent:true});
  Uploads.run(); toast(`가져오기 완료: 시설 ${nf}, 점검 ${ni}, 사진 ${np} (건너뜀 ${skip})`,{ms:6000}); render();
}
function pickImportFile(){ let inp=$('#fileInputs input[data-key="import"]'); if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.accept='.zip,application/zip'; inp.dataset.key='import'; $('#fileInputs').appendChild(inp); } inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; inp.value=''; if(f) await importPackage(f); }; inp.click(); }

/* ===================== 부팅 ===================== */
let pendingRerender=false;
function isTyping(){ const a=document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=='checkbox' && a.type!=='file'); }
Store.on(what=>{
  if (what==='load'){ scheduleRender(); return; }
  if (what.startsWith('synced:')){ SyncUI.update(); return; }
  if (!what.startsWith('change:')) return;
  const path=what.slice(7); const r=App.route;
  if (Exporting) return;
  if (r.name==='inspect'){
    if (path==='inspections/'+r.id){ const rec=Store.recs.get(path); if(rec && rec.dirty){ const i=Store.inspections.get(r.id); if(i) updateStepsBar(i); return; } if(isTyping()){ pendingRerender=true; return; } scheduleRender(); return; }
    if (path.startsWith('photos/')){ const p=Store.photos.get(path.slice(7)); if(p && p.inspectionId!==r.id) return; if(isTyping()){ pendingRerender=true; return; } if($('#modalRoot').firstElementChild) return; scheduleRender(); return; }
    if (path.startsWith('settings/')){ if(!isTyping()) scheduleRender(); }
    return;
  }
  if (r.name==='report'){ if(path==='inspections/'+r.id || path.startsWith('photos/')) scheduleRender(); return; }
  if (!isTyping()) scheduleRender();
});
document.addEventListener('focusout', ()=>{ if(!pendingRerender) return; setTimeout(()=>{ if(pendingRerender && !isTyping()){ pendingRerender=false; scheduleRender(); } },150); });

(async function boot(){
  $('#brandBtn').onclick=()=>{ Editor.commit(); App.go({name:'home'}); };
  $('#userBtn').onclick=()=>userPanel();
  SyncUI.update();
  await IDB.open(); await Store.loadLocal(); App.restore(); render();
  await initRuntime();
  if (RT.mode==='cloud'){ Store.subscribeCloud(); const ub=$('#userBtn'); if(ub && RT.me && RT.me.name) ub.textContent=RT.me.name.length>6? RT.me.name.slice(0,6)+'…' : RT.me.name;
    for (const p of Store.photos.values()){ if(!p.assetId && p.status==='local'){ const rec=Store.recs.get('photos/'+p.id); if(rec){ p.status='pending'; rec.needsAsset=true; rec.dirty=true; await Store.persist(rec); } } } }
  else if (RT.signedOut){ const ub=$('#userBtn'); if(ub) ub.textContent='비로그인'; }
  SyncUI.update(); Store.scheduleFlush(300); Uploads.run(); scheduleRender();
  window.__app={Store, RT, IDB, App, Uploads, Editor, render, addPhotos, exportPdf, exportExcel, exportPackage, importPackage, buildItems, PHOTO_CATS, ITEM_IDS};
})();
